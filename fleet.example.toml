# Copy to ~/.config/herdsman/fleet.toml (or point FLEET_CONFIG at it).

models = ["opus", "sonnet", "claude-opus-5-5"]   # the model dropdown `herdsman serve` offers

[serve]
allowed_hosts = ["<mac>.<tailnet>.ts.net"]   # `tailscale serve` proxies the page over HTTPS
# approve_hint = "or send 'pair {code}' to the owner"   # appended to the pairing panel's Mac line
# tailscale_https_port = 8443   # `herdsman setup` runs `tailscale serve --bg --https=<port> http://<addr>`
# launchd_label = "dev.herdsman.serve"   # the board job `herdsman setup` writes (or adopts)
# theme = "kitchen"   # the Herd's theme: farm (default), kitchen or <config dir>/themes/<name>/ (docs/serve.md)

[fleet.api]
repo = "acme/api"
local = "~/Projects/api"
integration = "staging"          # herdsman merge target; main is never a target
# paused = true                  # `herdsman pause|resume api`: no next, impl/rev spawns refuse PAUSED

[fleet.api.role.impl]
harness = "claude"
profile = "lane-impl"
model = "opus"
effort = "xhigh"                 # none|low|medium|high|xhigh: Claude --effort, Hermes --reasoning
accounts = ["A", "B", "C"]   # Claude token: first uncapped one (or `account = "A"`)
# fallback = ["claude:A", "claude:B", "dsh"]   # #302: out of usage / signed out / won't start: the next entry carries on
mcp = ["supabase-dev"]        # only these servers from the repo's .mcp.json; default none

[fleet.api.role.rev]
harness = "hermes"
profile = "lane-rev"

# This repo, dogfooding: a `*/herdsman` repo's merge prints the `cargo install` that picks it up.
[fleet.herdsman]
repo = "<owner>/herdsman"
local = "~/Projects/herdsman"
integration = "staging"
# #438: lanes already share one cargo build folder per host and repo, `<root>/.build/herdsman` under
# the host's workspace root (#630); `env` or `shared_cache` (#361) setting
# CARGO_TARGET_DIR replaces it. Lanes building at once queue on cargo's lock (docs/lanes.md).
# shared_cache = { CARGO_TARGET_DIR = "~/.cache/herdsman/herdsman/target" }

[fleet.herdsman.role.impl]
harness = "claude"
profile = "lane-impl"
model = "opus"

[fleet.herdsman.role.rev]
harness = "hermes"
profile = "lane-rev"

[fleet.web]
repo = "acme/web"
local = "~/Projects/web"
integration = "staging"
# serial_paths = ["supabase/migrations/**"]   # the old form of one [[fleet.web.serial]] group named serial_label (default "db"), serial_max at a time
# required_checks = ["quality"]   # gate/check/wait look only at these (latest run each); unset = all checks
# premerge = ["herdsman cap-check --config ci/cap.toml", "cargo check --locked"]   # merge runs these on the PR merged with current integration (STAGING_WOULD_BREAK); unset = the cap check if ci/cap.toml
# merge_label = "merge-ready"      # added to the PR after a PASS at its head (full CI), removed if the head moves past it (a pure merge of integration keeps it)
# update_ready = "always"   # catch every behind PASSed PR up with integration; default "needed": only on a conflict or a strict branch rule
# line_cap = 10000   # `herdsman cap-check --config <this file>`: formatted src/**/*.rs lines, exit 1 over it
# lessons = "off"   # #419: `herdsman tick` runs `herdsman lesson` weekly per fleet (default "weekly"); "off" opts out
# max_impl = 2   # optional caps (CAP); unset = no cap, the host check protects the Mac
# max_rev = 2
# notify_global = true   # also send this fleet's events to the global [[notify]]
# clone_build = ["target"]   # cp -cR (APFS clone) these local folders into a new lane when the lockfile matches
# build_dirs = ["ios/build"]   # freed with target, node_modules, .next and dist when a lane finishes or over budget
# env = { npm_config_cache = "~/.cache/herdsman/npm" }   # npm fleets: one shared cache (pnpm's store already is)
# env = { PORT = "$HERDSMAN_PORT" }   # each lane's own port (a hash of fleet/branch), for dev servers
# port_range = "41000-41999"   # HERDSMAN_PORT's range (the default)
# ui_paths = ["web/**", "assets/**"]   # #417: a PR touching these goes through the verify stage (needs [fleet.web.role.verify])
# ask_thread = "t6"   # #541: lane asks go to this conductor thread first (default: the repo's most recently active one)

# #294: serial groups: at most `max` (default 1) issues touching `paths` in flight at once (docs/config.md).
[[fleet.web.serial]]
name = "db"   # ≤ 8 characters; also the Queue mark 🔒db and `queue add N --serial db`
paths = ["supabase/migrations/**"]

# #373: a named premerge check (instead of the list form above): it runs at merge and before an auto-update's push,
# only when the PR changes `when` paths; a failure refuses with `code` and starts a fix round briefed with `fix`.
# [[fleet.web.premerge]]
# name = "migration-order"
# run  = "node scripts/check-migrations.mjs --base origin/staging --ledger"   # secrets from the host env, never here
# when = ["supabase/migrations/**"]
# code = "BACKDATED_MIGRATION"
# fix  = "Rename the migration so its version is after {min}; output: {output}"   # {output}: last 20 lines, {min}: a min_version= line

# #350: fast-first landing (docs/config.md); unset or mode = "full-first" = land on the full suite, as before.
# [fleet.web.land]
# mode = "fast-first"   # a PASS lands once its `fast` checks are green; integration's own CI runs the full suite after
# fast = ["lint", "unit"]   # names of existing CI checks; `doctor` warns about names no recent PR reports
# full_first_paths = ["supabase/migrations/**", ".github/workflows/**"]   # a PR touching these waits for the full suite

# Per-fleet notifiers replace the global [[notify]] for this fleet's events (same fields).
[[fleet.web.notify]]
cmd = "notify <chat>:<thread>"   # e.g. one thread per repo
# cmd = "hermes send -q -t telegram:<chat_id>:<thread_id>"   # or Hermes, to Telegram
on = ["stall", "lane-dead", "ready-unmerged", "blocked", "merged", "needs-human", "evidence-missing"]

[fleet.web.role.impl]
harness = "hermes"
profile = "lane-impl"

[fleet.web.role.rev]
harness = "hermes"
profile = "lane-rev"

# Owner-only: `herdsman spawn web <issue> design`; the hook denies it from any lane.
[fleet.web.role.design]
harness = "hermes"
profile = "lane-design"

# #417: the optional verify stage (docs/pipeline.md): after rev's PASS, a read-only lane drives the real app at the
# head from the repo's .herdsman/verify.md and screenshots it against the approved design; FAILs use rev's rounds.
# [fleet.web.role.verify]
# harness = "claude"
# model = "claude-opus-5-5"

[accounts]
# Each account: the name of its token secret in the main host's OS store (`herdsman accounts import` from tokens.env).
A = "CLAUDE_CODE_OAUTH_TOKEN_A"
B = "CLAUDE_CODE_OAUTH_TOKEN_B"
C = "CLAUDE_CODE_OAUTH_TOKEN_C"
# cap_reset_minutes = 300
# cap_pattern = "usage limit reached|hit your limit"   # `|`-separated, case-insensitive
# pick = "headroom"   # spawns take the uncapped account with the most 5h/7d headroom; default "order"

# The usage meter: each account's own `claude` login folder (docs/providers.md); never given to lanes.
# [accounts.usage]
# A = "~/.config/herdsman/accounts/A"

# The DeepSeek balance row; the key is read from an env file or the store, never from here.
# [providers.deepseek]
# key_env = "DEEPSEEK_API_KEY"
# env_file = "~/.config/deepseek.env"   # default: the store's herdsman/all/DEEPSEEK_API_KEY
# warn_below = 5

[limits]
review_rounds = 3
update_rounds = 3   # `spawn --update` (conflict/behind) rounds, counted apart from review_rounds
# form_rounds = 3   # `FAIL (form-only)` verdicts per issue that don't count as a review round; then they do
# form_categories = ["trailer", "pr-body", "stale-baseline", "format", "docs-fresh", "migration-redate", "infra"]
#                   # a fleet's own `form_categories` / `form_rounds` replace these
# Both are the built-in pipeline's limits; a fleet with its own [fleet.<n>.pipeline] sets `rounds` per stage (docs/pipeline.md).
stall_minutes = 30   # herdsman check: stall / ready-unmerged threshold
ci_start_minutes = 10   # a PR head with no checks this long after its push is CI missing/broken: ci-missing alert, fix round
ask_default_minutes = 30  # herdsman check: a routine ask unanswered this long takes its recommended option
ask_expire_hours = 24     # herdsman check: an ask nobody waits on (no live asking lane) closes as expired
done_close_minutes = 5    # herdsman check: a done lane whose push/verdict is logged this long closes its session
import_max_age_hours = 24 # a remote host's unanswered asks older than this are never imported
max_pushes_per_pass = 3   # herdsman check pushes at most this many alerts a pass, then one summary
# fallback_rest_minutes = 60   # #302: an unavailable agent rests this long when its message names no reset
# rotate_mb = 20   # #343: an event log over this moves events older than 30 days to events-YYYYMM.jsonl.gz (kept)
transcript_days = 30      # Claude lanes' cleanupPeriodDays; lanes share ~/.claude, so below 30 (Claude's default) also prunes your own transcripts
load_per_cpu = 2.5   # herdsman spawn HOST_BUSY thresholds
swapout_rate = 2000  # pages swapped out per 2 s sample
min_free_gb = 10     # herdsman spawn DISK_LOW under this many GB free on /
worktree_budget_gb = 25   # over it drive frees the idlest lanes' build folders, then spawn refuses DISK_BUDGET
build_budget_gb = 20      # over it drive (and `reclaim`) removes the shared folder's profiles no cargo is building in; enabled remote hosts: the tick, after drive
stray_roots = ["/tmp", "$TMPDIR"]   # `herdsman clean` lists (--yes removes) stray Cargo build folders here, and a removed worktree's Claude temp dir
min_free_mem_gb = 2  # herdsman spawn MEM_LOW under this many GB of free + inactive memory
effort = "high"      # default for roles without `effort`; dsh accepts only "none" for now
# deny_commands = ["docker", "supabase start", { cmd = "git push --force", why = "REFUSED NO_FORCE: ask the owner" }]
# Commands the lane hook refuses (default: the container set in assets/deny_commands.toml). A fleet's
# `deny_commands` replaces it (`[]` = off), its `deny_commands_add` extends it; see docs/lanes.md.
fast_secs = 60       # `herdsman timer install`: the fast job (`drive --fast`: record verdicts, merge PASS + green)
slow_secs = 300      # and the tick (check + the full pass that starts lanes)
max_parallel_spawns = 6   # the pass launches each spawn as a detached kick, this many at once (0: spawn in the pass)
spawn_pending_max_secs = 300   # a spawn marker or kick lock older than this (or whose pid is gone) is stale

[[notify]]
cmd = "notify <chat>"   # any command; one plain line on stdin
# cmd = "hermes send -q -t telegram:<chat_id>"   # or Hermes, to Telegram
on = ["stall", "lane-dead", "ready-unmerged", "blocked", "merged", "needs-human", "evidence-missing", "account-capped"]
# format = "json"   # send the raw event JSON instead

# #303: the logins a host card's [sign in ▾] (or `herdsman setup <host> <name>`) runs; claude, gh and codex are built in.
# [[setup]]
# name = "claude B"
# cmd = "claude /login"
# env = { CLAUDE_CONFIG_DIR = "~/accounts/B" }

# #298, #455: the terminal runtime new lanes start in: herdr (default) or shed (docs/runtimes.md).
# [runtime]
# kind = "shed"   # "berth", its old name, still works for one release (with a warning)
# acp = "claude-acp"   # optional ACP mode (docs/runtimes.md)
# #565: or one fleet's own, e.g. to pilot ACP lanes (cooee's Workflow list) on it:
# [fleet.herdsman.runtime]
# kind = "shed-acp"   # each lane a claude-acp session, guarded by the profile's hook; needs the role's account
