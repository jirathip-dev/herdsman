# Copy to ~/.config/herdsman/fleet.toml (or point FLEET_CONFIG at it).

[fleet.sendmeter]
repo = "jirathip-dev/sendmeter"
local = "~/Projects/sendmeter"
integration = "staging"          # herdsman merge target; main is never a target

[fleet.sendmeter.role.orch]
harness = "hermes"
profile = "fleet-orch"

[fleet.sendmeter.role.impl]
harness = "claude"
profile = "fleet-impl"
model = "opus"

[fleet.sendmeter.role.rev]
harness = "hermes"
profile = "fleet-rev"

# This repo, dogfooding.
[fleet.fleet]
repo = "jirathip-dev/herdsman"
local = "~/Projects/fleet"
integration = "staging"

[fleet.fleet.role.impl]
harness = "claude"
profile = "fleet-impl"
model = "opus"

[fleet.fleet.role.rev]
harness = "hermes"
profile = "fleet-rev"

[fleet.synergy]
repo = "<owner>/synergy"
local = "~/Projects/synergy"
integration = "staging"
serial_paths = ["supabase/migrations/**"]   # one `--serial` lane at a time (SERIAL_BUSY / SERIAL_UNMARKED)
# max_impl = 2   # optional caps (CAP); unset = no cap, the host check protects the Mac
# max_rev = 2

[fleet.synergy.role.orch]
harness = "hermes"
profile = "fleet-orch"

[fleet.synergy.role.impl]
harness = "hermes"
profile = "fleet-impl"

[fleet.synergy.role.rev]
harness = "hermes"
profile = "fleet-rev"

# Conductor-only: `herdsman spawn synergy <issue> design`; the hook denies it from any lane.
[fleet.synergy.role.design]
harness = "hermes"
profile = "fleet-design"

[limits]
review_rounds = 3
stall_minutes = 30   # herdsman check: stall / ready-unmerged threshold
load_per_cpu = 2.5   # herdsman spawn HOST_BUSY thresholds
swapout_rate = 2000  # pages swapped out per 2 s sample

[[notify]]
cmd = "hermes send -q -t telegram:<chat_id>"   # one plain line on stdin
on = ["stall", "lane-dead", "ready-unmerged", "blocked", "merged", "needs-human", "evidence-missing"]
# format = "json"   # send the raw event JSON instead
