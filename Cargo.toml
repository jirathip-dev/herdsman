# #264: core (state, gates, commands) <- server (the phone page) <- service (#345) <- cli (the `herdsman` binary);
# docs/architecture.md.
[workspace]
members = ["crates/core", "crates/server", "crates/service", "crates/cli", "crates/keys"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jirathip-dev/herdsman"

# Lints for every crate root (moved from the old lib.rs, #264); the allows are style noise, docs/architecture.md (Code rules).
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
format_push_string = "allow"
format_collect = "allow"
many_single_char_names = "allow"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
hkdf = "0.13.0"
# #441: secrets in the main host's OS store (Keychain, Secret Service, Credential Manager); owner-approved.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
# #344: herdsman's state in one SQLite file (WAL); bundled, so no system libsqlite3.
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
# #345: `herdsman service`'s runtime (crates/service only; owner-approved in #345's q355).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
toml = "0.8"
# #375: TS bindings for the board (assets/types/), behind the `ts` feature only: never in the release build.
ts-rs = { version = "12", features = ["serde-json-impl"] }
# #298, #455: shed's wire types only (serde, no I/O), pinned to shed's rename merge commit until it tags a release.
shed-proto = { git = "https://github.com/jirathip-dev/shed", rev = "1f08d108afc54450d6fdf4b49f68c09d0ca7a8df" }
herdsman-core = { path = "crates/core" }
herdsman-server = { path = "crates/server" }
herdsman-service = { path = "crates/service" }
