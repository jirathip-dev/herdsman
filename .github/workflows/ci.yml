name: ci
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - name: build
        run: cargo build --release --locked
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked
      - name: docs leak gate (no ts.net hostname, chat ID or /Users/ path)
        run: "! grep -rnE '[A-Za-z0-9-]\\.ts\\.net|telegram:-?[0-9]|/Users/' docs/"
      - name: deps gate (direct deps ⊆ the allow-list in docs/serve.md)
        run: |
          extra=$(sed -n '/^\[dependencies\]/,/^\[/p' Cargo.toml | grep -oE '^[a-z0-9_-]+' | grep -vxE 'clap|serde|serde_json|toml|anyhow|thiserror|p256|aes-gcm|hkdf|sha2|base64' || true)
          test -z "$extra" || { echo "not allowed: $extra"; exit 1; }
      - name: line cap (≤ 6000 non-test Rust lines under src/)
        run: |
          n=$(find src -name '*.rs' -print0 | xargs -0 cat | wc -l)
          echo "src lines: $n"
          test "$n" -le 6000
